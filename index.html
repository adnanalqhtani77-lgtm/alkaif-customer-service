
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241044">
  <title>خدمة عملاء بيت الكيف</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      color:#fff;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(25,3,39,.20),rgba(25,3,39,.20)),
        url("background.png") center center / cover no-repeat fixed;
    }

    .card{
      width:min(100%,440px);
      text-align:center;
      padding:30px 24px 26px;
      border:1px solid rgba(232,190,91,.58);
      border-radius:28px;
      background:rgba(35,12,52,.68);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:
        0 22px 70px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.12);
    }

    .logo{
      width:min(74%,260px);
      max-height:230px;
      object-fit:contain;
      margin:0 auto 12px;
      display:block;
      filter:drop-shadow(0 8px 18px rgba(238,183,55,.2));
    }

    .eyebrow{
      color:#e7c16a;
      letter-spacing:1px;
      font-size:13px;
      margin:0 0 8px;
    }

    h1{
      font-size:27px;
      margin:0 0 9px;
      color:#f4d58a;
    }

    .sub{
      color:#f0e5f5;
      line-height:1.9;
      font-size:15px;
      margin:0 auto 22px;
    }

    .phone-box{
      margin-bottom:15px;
      text-align:right;
    }

    .phone-box label{
      display:block;
      margin-bottom:9px;
      color:#f4d58a;
      font-size:14px;
      font-weight:bold;
    }

    .phone-box input{
      width:100%;
      height:55px;
      padding:0 16px;
      border:1px solid rgba(232,190,91,.6);
      border-radius:14px;
      outline:none;
      background:rgba(255,255,255,.10);
      color:#fff;
      font-size:17px;
      text-align:center;
      direction:ltr;
      transition:.2s;
    }

    .phone-box input::placeholder{
      color:rgba(255,255,255,.65);
    }

    .phone-box input:focus{
      border-color:#e8c36e;
      box-shadow:0 0 0 3px rgba(232,195,110,.15);
    }

    .phone-box input.invalid{
      border-color:#ff7777;
      box-shadow:0 0 0 3px rgba(255,119,119,.12);
    }

    .message{
      display:none;
      color:#ffd4d4;
      font-size:13px;
      margin:10px 0 0;
      text-align:center;
    }

    .message.show{
      display:block;
    }

    .actions{
      display:grid;
      gap:13px;
    }

    a.action{
      min-height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:15px 18px;
      border-radius:16px;
      text-decoration:none;
      color:white;
      font-weight:700;
      font-size:17px;
      transition:transform .15s,filter .15s,opacity .15s;
      cursor:pointer;
      border:0;
    }

    a.action:active{
      transform:scale(.985);
    }

    a.action.loading{
      opacity:.65;
      pointer-events:none;
    }

    .call{
      background:linear-gradient(135deg,#b98936,#e8c36e);
      color:#24152d!important;
    }

    .whatsapp{
      background:linear-gradient(135deg,#168d58,#25b96e);
    }

    .hint{
      font-size:12px;
      color:#e3d4eb;
      margin:20px 0 0;
    }

    @media(max-width:480px){
      body{
        padding:18px;
        background-attachment:scroll;
      }

      .card{
        padding:26px 19px 23px;
      }

      h1{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img class="logo" src="logo.png" alt="شعار بيت الكيف">

    <p class="eyebrow">ALKAIF HOUSE</p>

    <h1>خدمة عملاء بيت الكيف</h1>

    <p class="sub">
      نسعد بتواصلكم معنا . اختر الطريقة المناسبة للتواصل معنا .
    </p>

    <!-- رقم العميل -->
    <div class="phone-box">
      <label for="customerPhone">رقم هاتفك</label>

      <input
        type="tel"
        id="customerPhone"
        inputmode="tel"
        autocomplete="tel"
        placeholder="05xxxxxxxx"
        maxlength="15"
      >

      <p class="message" id="phoneMessage">
        يرجى إدخال رقم هاتفك أولاً.
      </p>
    </div>

    <div class="actions">

      <a class="action call"
         href="tel:+966538174054"
         aria-label="اتصال مباشر بالإدارة">
        <span aria-hidden="true">☎</span>
        <span>اتصال عبر الهاتف</span>
      </a>

      <a class="action whatsapp"
         href="https://wa.me/966538174054"
         target="_blank"
         rel="noopener"
         aria-label="محادثة واتساب مع الإدارة">
        <span aria-hidden="true">💬</span>
        <span>مراسلة عبر واتساب</span>
      </a>

    </div>

    <p class="hint">
      نحن هنا لخدمتكم ونرحب باستفساراتكم وملاحظاتكم
    </p>

  </main>

  <script>
    // ==========================================
    // Supabase connection
    // ==========================================

    const SUPABASE_URL = "https://jcfcxqkqgfahncpsawcf.supabase.co";

    const SUPABASE_KEY = "sb_publishable_2Dgjy1SMu6jE_hEzy3YQ4Q_X-so_wYm";

    const CONTACT_TABLE = "customer_contact_clicks";

    // قراءة رقم الفرع من رابط QR
    const urlParams = new URLSearchParams(window.location.search);
    const branchId = urlParams.get("branch");

    // العناصر
    const phoneInput = document.getElementById("customerPhone");
    const phoneMessage = document.getElementById("phoneMessage");
    const callButton = document.querySelector(".call");
    const whatsappButton = document.querySelector(".whatsapp");

    // ==========================================
    // تنسيق رقم الهاتف السعودي
    // ==========================================

    function normalizeSaudiPhone(phone) {

      let number = phone.replace(/\D/g, "");

      // 05xxxxxxxx
      if (/^05\d{8}$/.test(number)) {
        return "966" + number.substring(1);
      }

      // 9665xxxxxxxx
      if (/^9665\d{8}$/.test(number)) {
        return number;
      }

      // 5xxxxxxxx
      if (/^5\d{8}$/.test(number)) {
        return "966" + number;
      }

      return null;
    }

    // إخفاء التنبيه
    function hideMessage() {
      phoneMessage.classList.remove("show");
      phoneInput.classList.remove("invalid");
    }

    // إظهار تنبيه إدخال الرقم
    function showPhoneMessage() {
      phoneMessage.textContent = "يرجى إدخال رقم هاتفك أولاً.";
      phoneMessage.classList.add("show");
      phoneInput.classList.add("invalid");
      phoneInput.focus();
    }

    // تنبيه رقم غير صحيح
    function showInvalidPhone() {
      phoneMessage.textContent = "يرجى إدخال رقم هاتف صحيح.";
      phoneMessage.classList.add("show");
      phoneInput.classList.add("invalid");
      phoneInput.focus();
    }

    phoneInput.addEventListener("input", hideMessage);

    // ==========================================
    // تسجيل عملية التواصل في Supabase
    // ==========================================

    async function logContactClick(contactType, customerPhone) {

      const payload = {
        branch_id: branchId || null,
        contact_type: contactTypeSafe(contactType = contactType),
        customer_phone: customerPhone,
        call_reason: null,
        employee_name: null,
        status: "جديد"
      };

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${CONTACT_TABLE}`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(payload)
        }
      );

      if (!response.ok) {
        const errorText = await response.text();
        console.error("Contact logging failed:", errorText);
        throw new Error("فشل تسجيل العملية");
      }

      return true;
    }

    // ==========================================
    // التحقق من الرقم وتسجيل العملية
    // ==========================================

    async function prepareContact(contactType) {

      hideMessage();

      const rawPhone = phoneInput.value.trim();

      if (!rawPhone) {
        showPhoneMessage();
        return null;
      }

      const normalizedPhone = normalizeSaudiPhone(rawPhone);

      if (!normalizedPhone) {
        showInvalidPhone();
        return null;
      }

      // منع الضغط المتكرر
      callButton.classList.add("loading");
      whatsappButton.classList.add("loading");

      try {

        // تسجيل البيانات أولاً
        await logContactClick(contactType, normalizedPhone);

        return normalizedPhone;

      } catch (error) {

        phoneMessage.textContent = "تعذر تسجيل بياناتك، يرجى المحاولة مرة أخرى.";
        phoneMessage.classList.add("show");

        return null;

      } finally {

        callButton.classList.remove("loading");
        whatsappButton.classList.remove("loading");

      }
    }

    // ==========================================
    // الاتصال
    // ==========================================

    callButton.addEventListener("click", async function(event) {

      event.preventDefault();

      const phone = await prepareContact("call");

      if (!phone) return;

      window.location.href = "tel:+966538174054";

    });

    // ==========================================
    // واتساب
    // ==========================================

    whatsappButton.addEventListener("click", async function(event) {

      event.preventDefault();

      const phone = await prepareContact("whatsapp");

      if (!phone) return;

      window.open(
        "https://wa.me/966538174054",
        "_blank"
      );

    });

  </script>

</body>
</html>
