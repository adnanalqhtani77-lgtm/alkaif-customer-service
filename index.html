
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241044">
  <title>خدمة عملاء بيت الكيف</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      color:#fff;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(25,3,39,.20),rgba(25,3,39,.20)),
        url("background.png") center center / cover no-repeat fixed;
    }

    .card{
      width:min(100%,440px);
      text-align:center;
      padding:30px 24px 26px;
      border:1px solid rgba(232,190,91,.58);
      border-radius:28px;
      background:rgba(35,12,52,.68);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:
        0 22px 70px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.12);
    }

    .logo{
      width:min(74%,260px);
      max-height:230px;
      object-fit:contain;
      margin:0 auto 12px;
      display:block;
      filter:drop-shadow(0 8px 18px rgba(238,183,55,.2));
    }

    .eyebrow{
      color:#e7c16a;
      letter-spacing:1px;
      font-size:13px;
      margin:0 0 8px;
    }

    h1{
      font-size:27px;
      margin:0 0 9px;
      color:#f4d58a;
    }

    .sub{
      color:#f0e5f5;
      line-height:1.9;
      font-size:15px;
      margin:0 auto 25px;
    }

    .actions{
      display:grid;
      gap:13px;
    }

    a.action{
      min-height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:15px 18px;
      border-radius:16px;
      text-decoration:none;
      color:white;
      font-weight:700;
      font-size:17px;
      transition:transform .15s,filter .15s;
    }

    a.action:active{
      transform:scale(.985);
    }

    .call{
      background:linear-gradient(135deg,#b98936,#e8c36e);
      color:#24152d!important;
    }

    .whatsapp{
      background:linear-gradient(135deg,#168d58,#25b96e);
    }

    .hint{
      font-size:12px;
      color:#e3d4eb;
      margin:20px 0 0;
    }

    @media(max-width:480px){
      body{
        padding:18px;
        background-attachment:scroll;
      }

      .card{
        padding:26px 19px 23px;
      }

      h1{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img class="logo" src="logo.png" alt="شعار بيت الكيف">

    <p class="eyebrow">ALKAIF HOUSE</p>

    <h1>خدمة عملاء بيت الكيف</h1>

    <p class="sub">
      نسعد بتواصلكم معنا . اختر الطريقة المناسبة للتواصل معنا .
    </p>

    <div class="actions">

      <a class="action call"
         href="tel:+966538174054"
         aria-label="اتصال مباشر بالإدارة">
        <span aria-hidden="true">☎</span>
        <span>اتصال عبر الهاتف</span>
      </a>

      <a class="action whatsapp"
         href="https://wa.me/966538174054"
         target="_blank"
         rel="noopener"
         aria-label="محادثة واتساب مع الإدارة">
        <span aria-hidden="true">💬</span>
        <span>مراسلة عبر واتساب</span>
      </a>

    </div>

    <p class="hint">
      نحن هنا لخدمتكم ونرحب باستفساراتكم وملاحظاتكم
    </p>

  </main>

  <script>
    // ==========================================
    // Supabase connection
    // ==========================================

    const SUPABASE_URL = "https://jcfcxqkqgfahncpsawcf.supabase.co";

    const SUPABASE_KEY = "sb_publishable_2Dgjy1SMu6jE_hEzy3YQ4Q_X-so_wYm";

    const CONTACT_TABLE = "customer_contact_clicks";

    // قراءة رقم الفرع من رابط QR
    const urlParams = new URLSearchParams(window.location.search);
    const branchId = urlParams.get("branch");

    // تسجيل عملية التواصل
    async function logContactClick(contactType) {

      const payload = {
        branch_id: branchId || null,
        contact_type: contactType
      };

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/${CONTACT_TABLE}`,
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(payload),
            keepalive: true
          }
        );

        if (!response.ok) {
          console.error(
            "Contact logging failed:",
            await response.text()
          );
        }

      } catch (error) {
        console.error("Supabase connection error:", error);
      }
    }

    // ==========================================
    // Call button
    // ==========================================

    const callButton = document.querySelector(".call");

    callButton.addEventListener("click", async function(event) {

      event.preventDefault();

      const phoneLink = this.href;

      // تسجيل العملية قبل الانتقال
      await Promise.race([
        logContactClick("call"),
        new Promise(resolve => setTimeout(resolve, 1200))
      ]);

      // فتح الاتصال حتى لو فشل التسجيل
      window.location.href = phoneLink;

    });

    // ==========================================
    // WhatsApp button
    // ==========================================

    const whatsappButton = document.querySelector(".whatsapp");

    whatsappButton.addEventListener("click", function(event) {

      event.preventDefault();

      const whatsappLink = this.href;

      // فتح واتساب مباشرة حتى لا يتم حظر النافذة
      window.open(whatsappLink, "_blank");

      // تسجيل العملية في الخلفية
      logContactClick("whatsapp");

    });

  </script>

</body>
</html>
